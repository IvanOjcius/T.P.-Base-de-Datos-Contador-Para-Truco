<body>

<div class="contenedor login-contenedor">
    <h1>Iniciar Sesión</h1>
    
    <form action="login.php" method="POST" class="formulario-login">
        
        <div class="grupo-input">
            <label for="usuario">Nombre de usuario</label><br>
            <input type="text" id="usuario" name="usuario" class="input-caja" placeholder="JuanPerez" required>

        <div class="grupo-input">
            <label for="contrasena">Contraseña</label><br>
            <input type="password" id="contrasena" name="contrasena" class="input-caja" placeholder="Contrasena123" required>

        <button type="submit">Continuar</button>
    </form>

        <button type="button">Registrarse</button>
    </a>
